<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <title>미니 학생관리</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 앱 화면 본문: 상단 메뉴, 오늘 수업 요약, 검색 및 목록이 여기에 표시됩니다. -->
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">MINI STUDENT MANAGER</p><h1 id="pageTitle">오늘 수업</h1></div>
      <button class="icon-button" id="openAdd" aria-label="추가">＋</button>
    </header>
    <!-- 백업 파일은 휴대폰을 바꾸거나 자료를 복원할 때 사용합니다. -->
    <section class="backup-panel" aria-label="데이터 파일 백업">
      <div><strong>데이터 파일 백업</strong><small>기기 변경이나 데이터 복원에 사용할 수 있어요.</small></div>
      <div class="backup-actions"><button class="secondary" id="exportData" type="button">파일로 저장</button><button class="secondary" id="importData" type="button">파일 불러오기</button><input class="hidden" id="backupFileInput" type="file" accept=".json,application/json"></div>
    </section>
    <!-- 메뉴 버튼의 data-page 값에 따라 app.js가 화면을 바꿉니다. -->
    <nav class="main-nav">
      <button class="nav-item active" data-page="today">오늘 수업</button>
      <button class="nav-item" data-page="students">학생 관리</button>
      <button class="nav-item" data-page="classes">수업·강사 관리</button>
    </nav>
    <section class="hero-card"><div><p class="muted" id="heroText">오늘 예정된 수업과 학생을 확인해요</p><strong id="todayLabel"></strong></div><span class="hero-emoji">✦</span></section>
    <section class="stats-grid" id="studentStats"><article><span id="totalLabel">오늘 수업</span><strong id="totalCount">0</strong></article><article><span id="presentLabel">수업 학생</span><strong id="presentCount">0</strong></article><article><span id="attentionLabel">결석</span><strong id="attentionCount">0</strong></article></section>
    <section class="excel-panel" id="studentExcelPanel">
      <div class="excel-guide">
        <strong>엑셀 일괄등록</strong>
        <span>필수: 이름 · 수강번호 · 수업명</span>
        <small>선택: 보호자연락처 · 메모 · 상태</small>
      </div>
      <div class="excel-actions">
        <button class="secondary excel-button" id="downloadStudentTemplate" type="button">양식 받기</button>
        <button class="primary excel-button" id="selectStudentExcel" type="button">엑셀 파일 입력</button>
        <input class="hidden" id="studentExcelInput" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
      </div>
    </section>
    <section class="toolbar">
      <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="이름, 수강번호 또는 메모 검색"></label>
      <div class="filter-row" id="studentFilters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="present">출석</button><button class="filter" data-filter="absent">결석</button><button class="filter" data-filter="attention">주의</button></div>
    </section>
    <section class="management-tools hidden" id="classManagementTools">
      <div><strong>강사와 수업 관리</strong><small>강사를 등록하면 새 수업에 자동으로 선택됩니다.</small></div>
      <button class="secondary" id="openTeacherAdd" type="button">강사 등록</button>
    </section>
    <section class="student-list" id="studentList"></section>
    <div class="empty-state hidden" id="emptyState"><div>☁</div><p id="emptyText">아직 등록된 학생이 없어요.</p><button class="primary" id="emptyAdd">첫 학생 등록하기</button></div>
  </main>

  <!-- 아래 창들은 학생·강사·수업을 새로 등록하거나 수정할 때 열립니다. -->
  <dialog id="studentDialog">
    <form method="dialog" id="studentForm">
      <div class="dialog-head"><h2>학생 등록</h2><button class="close" type="button" data-close="studentDialog">×</button></div>
      <input type="hidden" id="studentId">
      <label>이름<input id="nameInput" required maxlength="30"></label>
      <label>수강번호<input id="enrollmentNumberInput" maxlength="30" inputmode="numeric" placeholder="예: 2026001"></label>
      <label>등록 수업<select id="classInput" required></select></label>
      <label>보호자 연락처<input id="studentPhone" type="tel" placeholder="010-0000-0000"></label>
      <label>메모<textarea id="memoInput" maxlength="100"></textarea></label>
      <label>오늘의 상태<select id="statusInput"><option value="present">출석</option><option value="absent">결석</option><option value="attention">주의 필요</option></select></label>
      <div class="dialog-actions"><button class="secondary" type="button" data-close="studentDialog">취소</button><button class="primary">저장하기</button></div>
    </form>
  </dialog>

  <dialog id="teacherDialog">
    <form method="dialog" id="teacherForm">
      <div class="dialog-head"><h2>강사 등록</h2><button class="close" type="button" data-close="teacherDialog">×</button></div>
      <input type="hidden" id="teacherId">
      <label>강사명<input id="teacherName" required maxlength="30"></label>
      <div class="dialog-actions"><button class="secondary" type="button" data-close="teacherDialog">취소</button><button class="primary" type="submit">강사 등록</button></div>
    </form>
  </dialog>

  <dialog id="classDialog">
    <form method="dialog" id="classForm">
      <div class="dialog-head"><h2>수업 등록</h2><button class="close" type="button" data-close="classDialog">×</button></div>
      <input type="hidden" id="classId">
      <label>수업명<input id="className" required maxlength="40"></label>
      <label>담당 강사<select id="classTeacher"></select></label>
      <label>수업 시간 1<select id="classTime1"></select></label>
      <label>수업 시간 2 (선택)<select id="classTime2"></select></label>
      <div class="dialog-actions"><button class="secondary" type="button" data-close="classDialog">취소</button><button class="primary">저장하기</button></div>
    </form>
  </dialog>
  <!-- 엑셀 읽기 도구를 먼저 불러온 뒤 앱 기능을 실행합니다. -->
  <script src="xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
