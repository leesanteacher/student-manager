<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fc"><title>미니 학생관리</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">MINI STUDENT MANAGER</p><h1 id="pageTitle">오늘의 학생관리</h1></div><button class="icon-button" id="openAdd" aria-label="추가">＋</button></header><nav class="main-nav"><button class="nav-item active" data-page="students">학생 관리</button><button class="nav-item" data-page="teachers">강사 등록</button><button class="nav-item" data-page="classes">수업 등록</button></nav><section class="hero-card"><div><p class="muted" id="heroText">오늘도 차근차근, 우리 반을 살펴봐요</p><strong id="todayLabel"></strong></div><span class="hero-emoji">✦</span></section><section class="stats-grid" id="studentStats"><article><span>전체 학생</span><strong id="totalCount">0</strong></article><article><span>출석</span><strong id="presentCount">0</strong></article><article><span>주의 필요</span><strong id="attentionCount">0</strong></article></section><section class="toolbar"><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="이름 또는 메모 검색"></label><div class="filter-row" id="studentFilters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="present">출석</button><button class="filter" data-filter="absent">결석</button><button class="filter" data-filter="attention">주의</button></div></section><section class="student-list" id="studentList"></section><div class="empty-state hidden" id="emptyState"><div>☁</div><p id="emptyText">아직 등록된 학생이 없어요.</p><button class="primary" id="emptyAdd">첫 학생 등록하기</button></div></main><dialog id="studentDialog"><form method="dialog" id="studentForm"><div class="dialog-head"><h2>학생 등록</h2><button class="close" type="button" data-close="studentDialog">×</button></div><input type="hidden" id="studentId"><label>이름<input id="nameInput" required maxlength="30"></label><label>학년 / 반<input id="classInput" maxlength="30"></label><label>메모<textarea id="memoInput" maxlength="100"></textarea></label><label>오늘의 상태<select id="statusInput"><option value="present">출석</option><option value="absent">결석</option><option value="attention">주의 필요</option></select></label><div class="dialog-actions"><button class="secondary" type="button" data-close="studentDialog">취소</button><button class="primary">저장하기</button></div></form></dialog><dialog id="teacherDialog"><form method="dialog" id="teacherForm"><div class="dialog-head"><h2>강사 등록</h2><button class="close" type="button" data-close="teacherDialog">×</button></div><input type="hidden" id="teacherId"><label>강사명<input id="teacherName" required maxlength="30"></label><label>담당 과목<input id="teacherSubject" required maxlength="30" placeholder="예: 수학"></label><div class="dialog-actions"><button class="secondary" type="button" data-close="teacherDialog">취소</button><button class="primary">저장하기</button></div></form></dialog><dialog id="classDialog"><form method="dialog" id="classForm"><div class="dialog-head"><h2>수업 등록</h2><button class="close" type="button" data-close="classDialog">×</button></div><input type="hidden" id="classId"><label>수업명<input id="className" required maxlength="40"></label><label>담당 강사<select id="classTeacher"></select></label><label>수업 시간 1<select id="classTime1"></select></label><label>수업 시간 2 (선택)<select id="classTime2"></select></label><div class="dialog-actions"><button class="secondary" type="button" data-close="classDialog">취소</button><button class="primary">저장하기</button></div></form></dialog><script src="app.js"></script></body></html>
